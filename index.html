<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع والتطبيق تحت الصيانة</title>
    
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 CDN Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #080c14;
            color: #f3f4f6;
            overflow: hidden;
        }

        /* Canvas Background styling */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255, 255, 255, 0.03);
        }

        /* Glowing Border Animation Effect */
        .glow-effect {
            position: relative;
        }
        .glow-effect::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #06b6d4, #ec4899);
            border-radius: 2rem;
            z-index: -1;
            filter: blur(16px);
            opacity: 0.4;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.3; filter: blur(14px); }
            100% { opacity: 0.65; filter: blur(20px); }
        }

        /* Gear Animations */
        .gear-spin-clockwise {
            animation: spin 10s linear infinite;
        }
        .gear-spin-counter {
            animation: spin-reverse 7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Continuous Progress Bar Shimmer Effect */
        .progress-shimmer {
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Fade Text Transition Class */
        .fade-text {
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }
        .fade-text.hide {
            opacity: 0;
            transform: translateY(8px);
        }
        .fade-text.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative select-none">

    <!-- Dynamic Animated Particles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Main Floating Glass Container -->
    <main class="relative z-10 w-full max-w-2xl glass-card glow-effect rounded-3xl p-8 md:p-12 text-center my-auto">

        <!-- Icons Header: Web, App & Maintenance Gears -->
        <div class="relative w-36 h-36 mx-auto mb-8 flex items-center justify-center">
            
            <!-- Web Icon (Left) -->
            <div class="absolute top-2 left-1 bg-slate-800/80 p-3 rounded-2xl border border-blue-500/30 text-blue-400 shadow-lg backdrop-blur-md transform -rotate-12 animate-bounce" style="animation-duration: 3s;">
                <i class="fa-solid fa-globe text-2xl md:text-3xl"></i>
            </div>

            <!-- App Mobile Icon (Right) -->
            <div class="absolute top-2 right-1 bg-slate-800/80 p-3 rounded-2xl border border-purple-500/30 text-purple-400 shadow-lg backdrop-blur-md transform rotate-12 animate-bounce" style="animation-duration: 3.5s;">
                <i class="fa-solid fa-mobile-screen-button text-2xl md:text-3xl"></i>
            </div>

            <!-- Center Animated Gears Layer -->
            <i class="fa-solid fa-gear text-6xl text-cyan-400 gear-spin-clockwise absolute opacity-90 drop-shadow-[0_0_18px_rgba(6,182,212,0.6)]"></i>
            <i class="fa-solid fa-gear text-4xl text-pink-500 gear-spin-counter absolute -bottom-1 -right-1 opacity-90 drop-shadow-[0_0_18px_rgba(236,72,153,0.6)]"></i>

            <!-- Central Wrench Badge -->
            <div class="z-10 bg-slate-900/90 p-3.5 rounded-full border border-white/20 shadow-xl backdrop-blur-lg">
                <i class="fa-solid fa-screwdriver-wrench text-2xl text-gradient bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-cyan-300 to-purple-400"></i>
            </div>
        </div>

        <!-- Main Title -->
        <h1 class="text-3xl md:text-5xl font-black mb-4 tracking-tight bg-gradient-to-r from-blue-400 via-cyan-300 to-purple-400 bg-clip-text text-transparent drop-shadow-sm">
            الموقع والتطبيق تحت الصيانة
        </h1>

        <!-- Continuous Fade In / Fade Out Dynamic Text -->
        <div class="h-14 flex items-center justify-center mb-8 px-2">
            <p id="dynamic-subtitle" class="fade-text show text-base md:text-xl font-medium text-slate-300/90 leading-relaxed">
                نعمل حالياً على تحسين وتطوير تجربتكم...
            </p>
        </div>

        <!-- Progress Bar Section (Set to exactly 45%) -->
        <div class="w-full bg-slate-900/60 rounded-2xl p-5 border border-white/10 shadow-inner">
            <div class="flex justify-between items-center mb-3 px-1 text-sm md:text-base font-bold">
                <span class="flex items-center gap-2 text-cyan-400">
                    <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                    نسبة الإنجاز الحالي
                </span>
                <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    45%
                </span>
            </div>
            
            <!-- Bar Container -->
            <div class="w-full bg-slate-800/80 rounded-full h-4 p-0.5 border border-white/10 overflow-hidden shadow-inner">
                <!-- Neon Glowing Progress Fill (45%) -->
                <div class="h-full rounded-full bg-gradient-to-r from-blue-500 via-cyan-400 to-purple-500 progress-shimmer transition-all duration-1000 shadow-[0_0_15px_rgba(6,182,212,0.8)]" style="width: 45%;"></div>
            </div>
        </div>

    </main>

    <!-- JavaScript logic -->
    <script>
        // --- 1. Continuous Dynamic Fade In / Fade Out Text Loop ---
        const textMessages = [
            "نعمل حالياً على تحسين وتطوير تجربتكم...",
            "سنعود إليكم بقوة وقريباً جداً...",
            "شكراً لانتظاركم وتفهمكم..."
        ];

        let messageIndex = 0;
        const textElement = document.getElementById('dynamic-subtitle');

        function updateTextLoop() {
            // Fade out
            textElement.classList.remove('show');
            textElement.classList.add('hide');

            setTimeout(() => {
                // Switch Message
                messageIndex = (messageIndex + 1) % textMessages.length;
                textElement.textContent = textMessages[messageIndex];
                
                // Fade in
                textElement.classList.remove('hide');
                textElement.classList.add('show');
            }, 600); // Duration matches CSS transition
        }

        // Change text every 3.5 seconds
        setInterval(updateTextLoop, 3500);


        // --- 2. Interactive Background Canvas Particles ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(window.innerWidth / 18), 65);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Subtle connecting lines between close particles
            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 110) {
                        ctx.strokeStyle = `rgba(139, 92, 246, ${0.15 - dist / 1000})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        window.onload = function() {
            resizeCanvas();
            initParticles();
            animateParticles();
        };
    </script>
</body>
</html>
