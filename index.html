<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع والتطبيق تحت الصيانة</title>
    
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 CDN Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050811;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Canvas Background styling */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(12, 19, 36, 0.78);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.04);
        }

        /* Glowing Border Animation Effect */
        .glow-effect {
            position: relative;
        }
        .glow-effect::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #2563eb, #7c3aed, #06b6d4, #ec4899);
            border-radius: 2rem;
            z-index: -1;
            filter: blur(18px);
            opacity: 0.45;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.35; filter: blur(14px); }
            100% { opacity: 0.75; filter: blur(24px); }
        }

        /* Gear Animations */
        .gear-spin-clockwise {
            animation: spin 10s linear infinite;
        }
        .gear-spin-counter {
            animation: spin-reverse 7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Progress Bar Shimmer Effect */
        .progress-shimmer {
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Fade Text Transition Class */
        .fade-text {
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }
        .fade-text.hide {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Glowing Button Hover & Animation */
        .backup-btn {
            position: relative;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #db2777 100%);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: gradient-shift 6s ease infinite;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5), 0 0 15px rgba(124, 58, 237, 0.3);
        }

        .backup-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 35px -5px rgba(37, 99, 235, 0.7), 0 0 25px rgba(219, 39, 119, 0.6);
            background-position: right center;
        }

        .backup-btn:active {
            transform: translateY(1px) scale(0.99);
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Pulse light ring for buttons */
        .btn-glow-ring {
            position: absolute;
            inset: -3px;
            border-radius: 1rem;
            background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
            z-index: -1;
            opacity: 0.6;
            filter: blur(8px);
            transition: opacity 0.3s ease;
        }
        .backup-btn:hover .btn-glow-ring {
            opacity: 1;
            filter: blur(12px);
        }

        /* Countdown Number Ring Animation */
        .countdown-circle {
            animation: pulse-ring 1s infinite alternate;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(6, 182, 212, 0.4); }
            100% { transform: scale(1.08); box-shadow: 0 0 22px rgba(6, 182, 212, 0.8); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative select-none">

    <!-- Dynamic Animated Particles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Main Floating Glass Container -->
    <main class="relative z-10 w-full max-w-2xl glass-card glow-effect rounded-3xl p-6 sm:p-10 text-center my-auto">

        <!-- Icons Header: Web, App & Maintenance Gears -->
        <div class="relative w-32 h-32 sm:w-36 sm:h-36 mx-auto mb-6 flex items-center justify-center">
            
            <!-- Web/Laptop Icon (Left) -->
            <div class="absolute top-1 left-0 bg-slate-800/90 p-3 rounded-2xl border border-blue-500/40 text-blue-400 shadow-lg backdrop-blur-md transform -rotate-12 animate-bounce" style="animation-duration: 3s;">
                <i class="fa-solid fa-laptop text-2xl sm:text-3xl"></i>
            </div>

            <!-- App Mobile Icon (Right) -->
            <div class="absolute top-1 right-0 bg-slate-800/90 p-3 rounded-2xl border border-purple-500/40 text-purple-400 shadow-lg backdrop-blur-md transform rotate-12 animate-bounce" style="animation-duration: 3.5s;">
                <i class="fa-solid fa-mobile-screen-button text-2xl sm:text-3xl"></i>
            </div>

            <!-- Center Animated Gears Layer -->
            <i class="fa-solid fa-gear text-5xl sm:text-6xl text-cyan-400 gear-spin-clockwise absolute opacity-90 drop-shadow-[0_0_18px_rgba(6,182,212,0.6)]"></i>
            <i class="fa-solid fa-gear text-3xl sm:text-4xl text-pink-500 gear-spin-counter absolute -bottom-1 -right-1 opacity-90 drop-shadow-[0_0_18px_rgba(236,72,153,0.6)]"></i>

            <!-- Central Wrench Badge -->
            <div class="z-10 bg-slate-900/90 p-3 sm:p-3.5 rounded-full border border-white/20 shadow-xl backdrop-blur-lg">
                <i class="fa-solid fa-screwdriver-wrench text-xl sm:text-2xl text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-purple-400"></i>
            </div>
        </div>

        <!-- Main Title -->
        <h1 class="text-2xl sm:text-4xl md:text-5xl font-black mb-3 tracking-tight bg-gradient-to-r from-blue-400 via-cyan-300 to-purple-400 bg-clip-text text-transparent drop-shadow-sm">
            الموقع والتطبيق تحت الصيانة
        </h1>

        <!-- Continuous Fade In / Fade Out Dynamic Text Loop -->
        <div class="h-14 flex items-center justify-center mb-4 px-2">
            <p id="dynamic-subtitle" class="fade-text show text-sm sm:text-lg font-medium text-slate-300/90 leading-relaxed">
                نعمل على تحسين وتحديث خدماتنا لكم...
            </p>
        </div>

        <!-- Progress Bar Section (Set precisely to 45%) -->
        <div class="w-full bg-slate-900/80 rounded-2xl p-4 sm:p-5 border border-white/10 shadow-inner mb-6">
            <div class="flex justify-between items-center mb-2 px-1 text-xs sm:text-sm font-bold">
                <span class="flex items-center gap-2 text-cyan-400">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                    نسبة الإنجاز الحالية
                </span>
                <span class="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    45%
                </span>
            </div>
            
            <!-- Bar Container -->
            <div class="w-full bg-slate-800/80 rounded-full h-3.5 p-0.5 border border-white/10 overflow-hidden shadow-inner">
                <!-- Neon Glowing Progress Fill (45%) -->
                <div class="h-full rounded-full bg-gradient-to-r from-blue-500 via-cyan-400 to-purple-500 progress-shimmer transition-all duration-1000 shadow-[0_0_15px_rgba(6,182,212,0.8)]" style="width: 45%;"></div>
            </div>
        </div>

        <!-- Countdown Banner Section (5 Seconds Dynamic Redirect) -->
        <div class="bg-gradient-to-r from-blue-950/80 via-slate-900/90 to-purple-950/80 border border-cyan-500/30 rounded-2xl p-5 shadow-2xl backdrop-blur-md">
            
            <p class="text-sm sm:text-base text-slate-200 font-semibold mb-3 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rocket text-cyan-400 animate-bounce"></i>
                <span id="countdown-status">سيتم تحويلك تلقائياً إلى المنصة الاحتياطية خلال:</span>
            </p>

            <!-- Dynamic Countdown Circle -->
            <div class="flex items-center justify-center gap-3 mb-4">
                <div id="timer-box" class="countdown-circle w-14 h-14 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 border-2 border-white/30 flex items-center justify-center text-2xl font-black text-white shadow-lg">
                    <span id="seconds-count">5</span>
                </div>
                <span class="text-lg font-bold text-cyan-300">ثوانٍ</span>
            </div>

            <!-- Action Buttons: Go Now / Cancel Countdown -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                
                <!-- Main Go Now Button -->
                <a id="redirect-btn" 
                   href="https://sites.google.com/view/ff7y/%D8%AF%D8%B1%D8%B3%D8%A9-%D8%A7%D9%84%D9%85%D9%87%D9%86%D9%8A%D8%A9" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="backup-btn relative inline-flex items-center justify-center gap-2.5 w-full sm:w-auto px-6 py-3 rounded-xl text-white font-bold text-base border border-white/20 group">
                    <span class="btn-glow-ring"></span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-cyan-300 text-lg transition-transform duration-300 group-hover:scale-110"></i>
                    <span>الانتقال الآن للمنصة الاحتياطية</span>
                </a>

                <!-- Cancel Countdown Button -->
                <button id="cancel-btn" 
                        onclick="cancelRedirect()" 
                        class="w-full sm:w-auto px-5 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 hover:text-white font-semibold text-sm border border-white/10 transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-pause text-amber-400"></i>
                    <span>إيقاف التحويل التلقائي</span>
                </button>

            </div>
        </div>

    </main>

    <!-- JavaScript logic -->
    <script>
        // Target Backup URL
        const BACKUP_URL = "https://sites.google.com/view/ff7y/%D8%AF%D8%B1%D8%B3%D8%A9-%D8%A7%D9%84%D9%85%D9%87%D9%86%D9%8A%D8%A9";

        // --- 1. Dynamic 5-Second Redirect Countdown ---
        let timeLeft = 5;
        let timerInterval = null;
        let isCancelled = false;

        const secondsCountEl = document.getElementById('seconds-count');
        const countdownStatusEl = document.getElementById('countdown-status');
        const timerBoxEl = document.getElementById('timer-box');
        const cancelBtnEl = document.getElementById('cancel-btn');

        function startCountdown() {
            timerInterval = setInterval(() => {
                if (isCancelled) return;

                timeLeft--;
                if (timeLeft >= 0) {
                    secondsCountEl.textContent = timeLeft;
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    countdownStatusEl.textContent = "جاري التحويل الآن...";
                    
                    // Open in external target tab or redirect current page
                    window.open(BACKUP_URL, '_blank');
                    window.location.href = BACKUP_URL;
                }
            }, 1000);
        }

        function cancelRedirect() {
            isCancelled = true;
            clearInterval(timerInterval);
            
            // Visual feedback for cancellation
            timerBoxEl.classList.remove('countdown-circle');
            timerBoxEl.classList.add('bg-slate-700', 'border-slate-500');
            secondsCountEl.textContent = "II";
            countdownStatusEl.textContent = "تم إيقاف التحويل التلقائي.";
            cancelBtnEl.style.display = "none";
        }


        // --- 2. Dynamic Fade In / Fade Out Text Loop ---
        const textMessages = [
            "نعمل على تحسين وتحديث خدماتنا لكم...",
            "يمكنكم الانتقال للمنصة الاحتياطية لمتابعة العمل...",
            "شكراً لانتظاركم وتفهمكم..."
        ];

        let messageIndex = 0;
        const textElement = document.getElementById('dynamic-subtitle');

        function updateTextLoop() {
            textElement.classList.remove('show');
            textElement.classList.add('hide');

            setTimeout(() => {
                messageIndex = (messageIndex + 1) % textMessages.length;
                textElement.textContent = textMessages[messageIndex];
                
                textElement.classList.remove('hide');
                textElement.classList.add('show');
            }, 600);
        }

        setInterval(updateTextLoop, 3500);


        // --- 3. Interactive Background Canvas Particles ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(56, 189, 248, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(window.innerWidth / 18), 70);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            for (let a = 0; a < particles.length; a++) {
                for (let b = a + 1; b < particles.length; b++) {
                    const dx = particles[a].x - particles[b].x;
                    const dy = particles[a].y - particles[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 110) {
                        ctx.strokeStyle = `rgba(139, 92, 246, ${0.15 - dist / 1000})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        window.onload = function() {
            resizeCanvas();
            initParticles();
            animateParticles();
            startCountdown(); // Start 5 seconds countdown on load
        };
    </script>
</body>
</html>
