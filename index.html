<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>منصة منقذ المهني - الأقسام</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- خط Cairo المتميز -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
          
  <!-- مكتبة Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      width: 100%;
      position: fixed;
      touch-action: manipulation;
    }

    body {
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden; 
    }

    /* تخصيص شريط التمرير الداخلي للشبكة */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    /* أنيميشن النبض للخلفية */
    @keyframes slow-pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .animate-slow-pulse {
      animation: slow-pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col items-center justify-start pt-4 sm:pt-6 overflow-hidden selection:bg-amber-500 selection:text-slate-950 w-full relative">

  <!-- إضاءة خلفية للعنوان -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[150%] max-w-3xl h-64 bg-amber-500/10 rounded-full blur-[90px] pointer-events-none z-0"></div>

  <!-- ==================== عنوان الأقسام ==================== -->
  <header class="w-full max-w-sm px-8 flex flex-col items-center mb-3 relative z-10 text-center shrink-0">
    
    <div class="flex items-center justify-center gap-3 mb-2">
      <div class="w-9 h-9 shrink-0 rounded-xl bg-slate-900 border border-slate-800 shadow-[0_0_20px_rgba(245,158,11,0.15)] flex items-center justify-center text-amber-400">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
      </div>
      <h1 class="text-lg sm:text-xl font-black bg-gradient-to-r from-amber-200 via-amber-400 to-orange-500 bg-clip-text text-transparent leading-tight tracking-tight mt-1">
        الأقسام الرئيسية
      </h1>
    </div>

    <p class="text-[10px] sm:text-[11px] text-slate-400 font-medium flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-900/50 border border-slate-800/80 backdrop-blur-sm">
      <i data-lucide="pointer" class="w-3 h-3 text-amber-400"></i>
      اختر القسم المطلوب للاستعلام والتصفح
    </p>
  </header>

  <!-- ==================== حاوية الأقسام ==================== -->
  <main class="w-full max-w-sm px-8 pb-4 overflow-y-auto custom-scrollbar relative z-10 flex-1">
    <div class="grid grid-cols-2 gap-3">

      <!-- 🤖 1. قسم المساعد الذكي -->
      <button id="ai-faq-btn" class="w-full aspect-square group relative rounded-[1.25rem] p-[2px] bg-gradient-to-b from-indigo-500 via-purple-500 to-slate-800 shadow-[0_0_20px_rgba(99,102,241,0.15)] overflow-hidden transition-all duration-300 hover:-translate-y-1 active:scale-95">
        
        <div class="bg-slate-900/90 backdrop-blur-xl rounded-[1.15rem] p-3 h-full flex flex-col items-center justify-center text-center relative z-10 gap-2 overflow-hidden">
          
          <div class="absolute -top-6 -right-6 w-16 h-16 bg-indigo-500/40 rounded-full blur-xl animate-slow-pulse"></div>
          <div class="absolute -bottom-6 -left-6 w-16 h-16 bg-purple-500/40 rounded-full blur-xl animate-slow-pulse" style="animation-delay: 1s;"></div>
          
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-purple-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 group-hover:bg-gradient-to-br group-hover:from-indigo-500 group-hover:to-purple-500 group-hover:text-white transition-all duration-300 shadow-inner group-hover:shadow-[0_0_15px_rgba(99,102,241,0.6)] relative z-20">
            <i data-lucide="bot" class="w-6 h-6 group-hover:animate-bounce"></i>
          </div>
          
          <div class="relative z-20">
            <h2 class="text-[13px] sm:text-sm font-black bg-gradient-to-r from-indigo-300 to-purple-400 bg-clip-text text-transparent group-hover:from-white group-hover:to-white transition-colors">المساعد الذكي</h2>
            <p class="text-[9px] text-slate-400 mt-1 font-medium leading-relaxed px-1 line-clamp-2 group-hover:text-slate-300">الأسئلة الشائعة المدعومة بالذكاء الاصطناعي</p>
          </div>
        </div>
      </button>

      <!-- 📅 2. قسم جدول الامتحانات -->
      <button id="schedule-btn" class="w-full aspect-square group relative rounded-[1.25rem] p-[2px] bg-gradient-to-b from-emerald-400 via-teal-500/40 to-slate-800 shadow-lg shadow-emerald-500/10 overflow-hidden transition-all duration-300 hover:-translate-y-1 active:scale-95">
        <div class="absolute -top-10 -left-10 w-20 h-20 bg-emerald-500/20 rounded-full blur-xl pointer-events-none group-hover:bg-emerald-500/30 transition-colors"></div>
        <div class="bg-slate-900/90 backdrop-blur-xl rounded-[1.15rem] p-3 h-full flex flex-col items-center justify-center text-center relative z-10 gap-2">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-500/10 to-teal-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors duration-300 shadow-inner">
            <i data-lucide="calendar-days" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-[13px] sm:text-sm font-extrabold text-slate-100 group-hover:text-emerald-400 transition-colors">جدول الامتحانات</h2>
            <p class="text-[9px] text-slate-400 mt-0.5 font-medium leading-relaxed px-1 line-clamp-2">مواعيد الجداول الامتحانية الرسمية</p>
          </div>
        </div>
      </button>

      <!-- 🏆 3. قسم معدل الأوائل -->
      <button id="top-students-btn" class="w-full aspect-square group relative rounded-[1.25rem] p-[2px] bg-gradient-to-b from-amber-400 via-orange-500/40 to-slate-800 shadow-lg shadow-amber-500/10 overflow-hidden transition-all duration-300 hover:-translate-y-1 active:scale-95">
        <div class="absolute -top-10 -right-10 w-20 h-20 bg-amber-500/20 rounded-full blur-xl pointer-events-none group-hover:bg-amber-500/30 transition-colors"></div>
        <div class="bg-slate-900/90 backdrop-blur-xl rounded-[1.15rem] p-3 h-full flex flex-col items-center justify-center text-center relative z-10 gap-2">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-500/10 to-orange-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:bg-amber-500 group-hover:text-slate-950 transition-colors duration-300 shadow-inner">
            <i data-lucide="trophy" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-[13px] sm:text-sm font-extrabold text-slate-100 group-hover:text-amber-400 transition-colors">معدل الأوائل</h2>
            <p class="text-[9px] text-slate-400 mt-0.5 font-medium leading-relaxed px-1 line-clamp-2">هل أنتَ من الأوائل؟</p>
          </div>
        </div>
      </button>

      <!-- 📋 4. قسم نتائج المهني -->
      <button id="results-btn" class="w-full aspect-square group relative rounded-[1.25rem] p-[2px] bg-gradient-to-b from-cyan-400 via-blue-500/40 to-slate-800 shadow-lg shadow-cyan-500/10 overflow-hidden transition-all duration-300 hover:-translate-y-1 active:scale-95">
        <div class="absolute -bottom-10 -left-10 w-20 h-20 bg-cyan-500/20 rounded-full blur-xl pointer-events-none group-hover:bg-cyan-500/30 transition-colors"></div>
        <div class="bg-slate-900/90 backdrop-blur-xl rounded-[1.15rem] p-3 h-full flex flex-col items-center justify-center text-center relative z-10 gap-2">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-cyan-500/10 to-blue-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:bg-cyan-500 group-hover:text-slate-950 transition-colors duration-300 shadow-inner">
            <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-[13px] sm:text-sm font-extrabold text-slate-100 group-hover:text-cyan-400 transition-colors">نتائج المهني</h2>
            <p class="text-[9px] text-slate-400 mt-0.5 font-medium leading-relaxed px-1 line-clamp-2">استعلام عن النتائج الرسمية</p>
          </div>
        </div>
      </button>

      <!-- 🎓 5. قسم القبولات المركزية -->
      <div class="w-full aspect-square relative rounded-[1.25rem] p-[2px] bg-gradient-to-b from-slate-700 to-slate-900 opacity-75 cursor-not-allowed">
        <div class="bg-slate-900/95 backdrop-blur-xl rounded-[1.15rem] p-3 h-full flex flex-col items-center justify-center text-center relative z-10 gap-2">
          <span class="absolute top-2.5 left-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-[8px] font-bold px-1.5 py-0.5 rounded-full flex items-center gap-0.5 shadow-sm">
            <i data-lucide="lock" class="w-2.5 h-2.5"></i> قريباً
          </span>
          <div class="w-11 h-11 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 shadow-inner">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-[13px] sm:text-sm font-extrabold text-slate-300">القبولات المركزية</h2>
            <p class="text-[9px] text-slate-500 mt-0.5 font-medium leading-relaxed px-1 line-clamp-2">القبولات الجامعية والمعاهد للطلبة</p>
          </div>
        </div>
      </div>

      <!-- 🏫 6. قسم مواقع الاعدادية -->
      <div class="w-full aspect-square relative rounded-[1.25rem] p-[2px] bg-gradient-to-b from-slate-700 to-slate-900 opacity-75 cursor-not-allowed">
        <div class="bg-slate-900/95 backdrop-blur-xl rounded-[1.15rem] p-3 h-full flex flex-col items-center justify-center text-center relative z-10 gap-2">
          <span class="absolute top-2.5 left-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-[8px] font-bold px-1.5 py-0.5 rounded-full flex items-center gap-0.5 shadow-sm">
            <i data-lucide="lock" class="w-2.5 h-2.5"></i> قريباً
          </span>
          <div class="w-11 h-11 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 shadow-inner">
            <i data-lucide="map-pin" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-[12px] sm:text-sm font-extrabold text-slate-300">مواقع الإعداديات</h2>
            <p class="text-[9px] text-slate-500 mt-0.5 font-medium leading-relaxed px-1 line-clamp-2">مدارس الصناعة المهنية في المحافظة</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ==================== نافذة الإطار الموحدة (Iframe Modal) ==================== -->
  <div id="iframe-modal" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col transition-transform duration-500 ease-in-out translate-y-full">
    
    <!-- شريط التوجيه العلوي (زر الرجوع) -->
    <div class="h-14 sm:h-16 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
      <button id="close-modal" class="flex items-center gap-1.5 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 transition-colors py-1.5 px-3 rounded-lg border border-slate-700">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
        <span class="font-bold text-xs sm:text-sm mt-0.5">رجوع</span>
      </button>
      
      <!-- العنوان والنقطة النابضة (سيتم تغييرها برمجياً) -->
      <div class="flex items-center gap-2">
        <span id="modal-title" class="text-slate-100 font-bold text-sm">عنوان النافذة</span>
        <div id="modal-pulse" class="w-2 h-2 rounded-full animate-pulse"></div>
      </div>
      
      <div class="w-[70px]"></div> <!-- للحفاظ على توسيط العنوان -->
    </div>

    <!-- حاوية التضمين -->
    <div class="flex-1 w-full relative bg-slate-950">
      <!-- تأثير التحميل قبل ظهور الموقع -->
      <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-3 z-0">
        <i data-lucide="loader-2" class="w-8 h-8 text-indigo-500 animate-spin"></i>
        <p class="text-slate-400 text-xs font-medium">جاري التحميل...</p>
      </div>
      
      <iframe id="main-iframe" src="" class="w-full h-full border-none relative z-10 bg-transparent" title="إطار المحتوى"></iframe>
    </div>
  </div>

  <!-- سكربت تفعيل الأيقونات و التحكم بالنافذة -->
  <script>
    lucide.createIcons();

    // جلب العناصر من الواجهة
    const aiBtn = document.getElementById('ai-faq-btn');
    const resultsBtn = document.getElementById('results-btn'); 
    const scheduleBtn = document.getElementById('schedule-btn');
    const topStudentsBtn = document.getElementById('top-students-btn'); // تعريف زر الأوائل
    const modal = document.getElementById('iframe-modal');
    const closeBtn = document.getElementById('close-modal');
    const iframe = document.getElementById('main-iframe');
    const iframeLoader = document.getElementById('iframe-loader');
    const modalTitle = document.getElementById('modal-title');
    const modalPulse = document.getElementById('modal-pulse');

    // دالة موحدة لفتح النافذة بروابط و عناوين مختلفة
    function openModal(url, title, pulseColorClasses) {
      // تغيير العنوان واللون برمجياً
      modalTitle.textContent = title;
      modalPulse.className = `w-2 h-2 rounded-full animate-pulse ${pulseColorClasses}`;
      
      // إظهار النافذة
      modal.classList.remove('translate-y-full');
      modal.classList.add('translate-y-0');
      
      // إظهار علامة التحميل
      iframeLoader.style.display = 'flex';
      
      // تعيين الرابط بعد تأخير بسيط لضمان سلاسة حركة النافذة
      setTimeout(() => {
        iframe.src = url;
      }, 300);
    }

    // حدث الضغط على المساعد الذكي
    aiBtn.addEventListener('click', () => {
      openModal(
        'https://ai-blond-chi-92.vercel.app/', 
        'المساعد الذكي', 
        'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]' // لون أخضر
      );
    });

    // حدث الضغط على نتائج المهني
    resultsBtn.addEventListener('click', () => {
      openModal(
        'https://2026-chi-lac.vercel.app/', 
        'نتائج المهني', 
        'bg-cyan-500 shadow-[0_0_8px_rgba(6,182,212,0.8)]' // لون سماوي
      );
    });

    // حدث الضغط على جدول الامتحانات
    scheduleBtn.addEventListener('click', () => {
      openModal(
        'https://jadwal-roan.vercel.app/', 
        'جدول الامتحانات', 
        'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]' 
      );
    });

    // حدث الضغط على معدل الأوائل 
    topStudentsBtn.addEventListener('click', () => {
      openModal(
        'https://aliasal.vercel.app/', 
        'معدل الأوائل', 
        'bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.8)]' // لون ذهبي
      );
    });

    // إخفاء علامة التحميل عند اكتمال تحميل الإطار
    iframe.addEventListener('load', () => {
      if (iframe.src && iframe.src !== 'about:blank' && iframe.src !== window.location.href) {
        iframeLoader.style.display = 'none';
      }
    });

    // إغلاق النافذة
    closeBtn.addEventListener('click', () => {
      // إخفاء النافذة
      modal.classList.remove('translate-y-0');
      modal.classList.add('translate-y-full');
      
      // تفريغ الرابط لإيقاف العمليات بعد اختفاء النافذة
      setTimeout(() => {
        iframe.src = '';
      }, 500);
    });
  </script>
</body>
</html>
