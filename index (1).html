<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ملتقى المنصة العام</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
          
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    
    @keyframes messageSlide {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg-animate { animation: messageSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .reply-swipe-anim { transition: transform 0.2s ease-out; }
    
    .fade-out { opacity: 0; transform: scale(0.9); transition: all 0.3s ease-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-full overflow-hidden selection:bg-amber-500 selection:text-slate-950 flex flex-col relative">

  <!-- ==================== 1. نافذة التسجيل (Modal) ==================== -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl shadow-amber-500/10">
      <div class="w-16 h-16 bg-amber-500/20 text-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-amber-500/30">
        <i data-lucide="user-plus" class="w-8 h-8"></i>
      </div>
      <h2 class="text-xl font-extrabold text-center mb-1 text-slate-100">مرحباً بك في الملتقى</h2>
      <p class="text-xs text-center text-slate-400 mb-6">يرجى إدخال بياناتك للبدء في الدردشة</p>
      
      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5">الاسم</label>
          <input type="text" id="reg-name" placeholder="اكتب اسمك هنا..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 outline-none" />
        </div>
        
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5">الصورة الشخصية (من الاستوديو أو الملفات)</label>
          <label for="reg-file-input" class="flex items-center justify-center gap-2 w-full bg-slate-950 border border-dashed border-slate-700 hover:border-amber-500 rounded-xl px-4 py-3 text-slate-300 cursor-pointer transition text-xs font-bold">
            <i data-lucide="image-plus" class="w-5 h-5 text-amber-500"></i>
            <span id="file-name-label">اختر صورة من جهازك...</span>
          </label>
          <input type="file" id="reg-file-input" accept="image/*" class="hidden" onchange="handleImageSelection(event)" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5">كود الصلاحية (للمشرفين والإدارة فقط)</label>
          <input type="text" id="reg-code" placeholder="اتركه فارغاً إذا كنت طالباً" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 outline-none" />
        </div>
      </div>
      
      <div class="mt-8 flex gap-3">
        <button onclick="saveProfile()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-2.5 rounded-xl transition">حفظ وبدء</button>
        <button onclick="skipProfile()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl transition">تخطي كطالب</button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. نافذة تكبير الصورة (Profile Modal) ==================== -->
  <div id="profile-modal" class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeProfileModal()">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-xs text-center shadow-2xl relative" onclick="event.stopPropagation()">
      <button onclick="closeProfileModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
      <img id="modal-img" src="" class="w-32 h-32 rounded-full object-cover mx-auto border-4 border-slate-800 mb-4 shadow-lg" />
      <h3 id="modal-name" class="text-lg font-black text-slate-100 mb-1"></h3>
      <span id="modal-role" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-300"></span>
    </div>
  </div>

  <!-- ==================== 3. نافذة إعدادات الدردشة ==================== -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeSettingsModal()">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-sm shadow-2xl relative space-y-4" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-extrabold text-slate-100 flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-amber-500"></i> إعدادات الدردشة
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <!-- إعدادات الأصوات -->
      <div class="space-y-3">
        <h4 class="text-xs font-bold text-amber-400">إعدادات الأصوات</h4>
        
        <div class="flex items-center justify-between bg-slate-950/50 p-2.5 rounded-xl border border-slate-800">
          <span class="text-xs text-slate-300">صوت إرسال الرسائل</span>
          <input type="checkbox" id="snd-send-toggle" onchange="updateSoundSettings()" class="w-4 h-4 accent-amber-500 cursor-pointer" />
        </div>

        <div class="flex items-center justify-between bg-slate-950/50 p-2.5 rounded-xl border border-slate-800">
          <span class="text-xs text-slate-300">صوت استقبال الرسائل</span>
          <input type="checkbox" id="snd-recv-toggle" onchange="updateSoundSettings()" class="w-4 h-4 accent-amber-500 cursor-pointer" />
        </div>

        <div class="flex items-center justify-between bg-slate-950/50 p-2.5 rounded-xl border border-slate-800">
          <span class="text-xs text-slate-300">صوت الردود (المنشن)</span>
          <input type="checkbox" id="snd-reply-toggle" onchange="updateSoundSettings()" class="w-4 h-4 accent-amber-500 cursor-pointer" />
        </div>
      </div>

      <!-- إدارة البيانات والنشاط -->
      <div class="space-y-2 pt-2 border-t border-slate-800">
        <h4 class="text-xs font-bold text-amber-400">النشاط والحساب</h4>
        
        <button onclick="clearMyActivity()" class="w-full flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-bold py-2.5 rounded-xl transition">
          <i data-lucide="trash" class="w-4 h-4"></i> حذف نشاطي (حذف كل رسائلي)
        </button>

        <button onclick="deleteAccount()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-2.5 rounded-xl transition">
          <i data-lucide="user-x" class="w-4 h-4"></i> حذف الحساب وتسجيل الخروج
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 4. واجهة الدردشة ==================== -->
  <main class="flex-1 flex flex-col h-full w-full max-w-3xl mx-auto bg-slate-900/80 shadow-2xl relative">
    
    <!-- الترويسة -->
    <header class="flex items-center justify-between p-4 border-b border-slate-800/80 bg-slate-900/95 backdrop-blur z-20 shrink-0">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-amber-500/20 to-orange-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shadow-inner">
            <i data-lucide="messages-square" class="w-6 h-6"></i>
          </div>
          <span class="absolute -bottom-1 -right-1 flex h-3.5 w-3.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500 border-2 border-slate-900"></span>
          </span>
        </div>
        <div>
          <h1 class="text-sm md:text-base font-extrabold text-slate-100">ملتقى  منقذ المهني</h1>
          <p class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-1">
            <i data-lucide="users" class="w-3 h-3 text-emerald-500"></i>
            متصل الآن: <span id="online-count" class="text-emerald-400 font-bold">1</span>
          </p>
        </div>
      </div>

      <!-- زر الإعدادات -->
      <button onclick="openSettingsModal()" class="p-2 bg-slate-800/80 hover:bg-slate-800 text-slate-300 rounded-xl border border-slate-700 transition flex items-center justify-center">
        <i data-lucide="settings" class="w-5 h-5 text-amber-400"></i>
      </button>
    </header>

    <!-- صندوق الرسائل -->
    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar text-sm relative scroll-smooth bg-slate-950/40 pb-6">
      <div class="bg-amber-500/10 border border-amber-500/20 rounded-2xl p-3 text-xs text-amber-300/90 text-center mx-auto w-11/12 shadow-sm">
        👋 مرحباً بك! (اسحب الرسالة للرد، اضغط على صورة أي شخص لعرض حسابه)
      </div>
    </div>

    <!-- زر النزول للأسفل -->
    <button id="scroll-bottom-btn" onclick="scrollToBottom()" class="hidden absolute bottom-[100px] left-1/2 -translate-x-1/2 bg-slate-800/90 border border-slate-700 text-slate-200 p-2 rounded-full shadow-xl z-30 hover:bg-slate-700 transition backdrop-blur-md">
      <i data-lucide="arrow-down" class="w-5 h-5"></i>
    </button>

    <!-- زر المنشن -->
    <div id="mention-badge" onclick="scrollToNextReply()" class="hidden absolute bottom-[100px] right-6 bg-amber-500 text-slate-950 p-3 rounded-full shadow-[0_0_20px_rgba(245,158,11,0.5)] z-30 cursor-pointer hover:scale-110 transition">
      <i data-lucide="at-sign" class="w-6 h-6"></i>
      <span id="mention-count" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-slate-900 shadow-md">1</span>
    </div>

    <!-- منطقة الإدخال -->
    <footer class="shrink-0 bg-slate-900/95 backdrop-blur p-3 border-t border-slate-800/80 z-20">
      <div id="reply-preview" class="hidden shrink-0 flex items-center justify-between bg-slate-950/60 p-2.5 mb-3 rounded-xl border border-amber-500/30">
          <div class="border-r-2 border-amber-500 pr-3 overflow-hidden flex-1">
            <p id="reply-preview-sender" class="text-amber-400 text-xs font-bold mb-1"></p>
            <p id="reply-preview-text" class="text-slate-300 text-xs truncate"></p>
          </div>
          <button type="button" onclick="cancelReply()" class="text-slate-500 hover:text-red-400 p-1.5 bg-slate-800 rounded-lg ml-1 transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
      </div>

      <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center gap-2 relative">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." class="flex-1 bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-amber-500/80 transition shadow-inner" required autocomplete="off" />
        <button type="submit" class="p-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 hover:brightness-110 active:scale-95 transition font-extrabold shadow-md shrink-0 flex items-center justify-center">
          <i data-lucide="send" class="w-5 h-5"></i>
        </button>
      </form>
    </footer>

  </main>

  <!-- ==================== سكربت التشغيل وربط الفايربيس ==================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, onChildRemoved, set, onValue, onDisconnect, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCg8zxqsAQyUhdW5D_1MuL1db885ZzIQvg",
      authDomain: "munqidhapp-638c0.firebaseapp.com",
      databaseURL: "https://munqidhapp-638c0-default-rtdb.firebaseio.com",
      projectId: "munqidhapp-638c0",
      storageBucket: "munqidhapp-638c0.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'munqidh_live_chat_v2');

    let currentUser = JSON.parse(localStorage.getItem('munqidh_user_data'));
    let selectedImageBase64 = null;

    // إعدادات الأصوات الافتراضية
    let soundSettings = JSON.parse(localStorage.getItem('munqidh_sound_settings')) || {
       send: true,
       recv: true,
       reply: true
    };

    if (currentUser) {
       document.getElementById('login-modal').classList.add('hidden');
       setupPresence();
    }

    // تهيئة حالة أزرار الإعدادات
    document.getElementById('snd-send-toggle').checked = soundSettings.send;
    document.getElementById('snd-recv-toggle').checked = soundSettings.recv;
    document.getElementById('snd-reply-toggle').checked = soundSettings.reply;

    window.updateSoundSettings = function() {
       soundSettings = {
          send: document.getElementById('snd-send-toggle').checked,
          recv: document.getElementById('snd-recv-toggle').checked,
          reply: document.getElementById('snd-reply-toggle').checked
       };
       localStorage.setItem('munqidh_sound_settings', JSON.stringify(soundSettings));
    };

    // إدارة نوافذ الإعدادات
    window.openSettingsModal = function() {
       const modal = document.getElementById('settings-modal');
       modal.classList.remove('hidden');
       setTimeout(() => modal.classList.remove('opacity-0'), 10);
    };

    window.closeSettingsModal = function() {
       const modal = document.getElementById('settings-modal');
       modal.classList.add('opacity-0');
       setTimeout(() => modal.classList.add('hidden'), 300);
    };

    // حذف نشاط المستخدم (رسائله فقط)
    window.clearMyActivity = async function() {
       if(!confirm('هل أنت متأكد من حذف جميع رسائلك النشطة في الدردشة؟')) return;
       const snapshot = await get(chatRef);
       if(snapshot.exists()) {
          const updates = {};
          snapshot.forEach((childSnap) => {
             const msg = childSnap.val();
             if(msg.userId === currentUser.id) {
                updates[childSnap.key] = null;
             }
          });
          await update(chatRef, updates);
          alert('تم حذف نشاطك بنجاح.');
          closeSettingsModal();
       }
    };

    // حذف الحساب وتسجيل الخروج
    window.deleteAccount = function() {
       if(!confirm('هل تريد حقاً حذف حسابك من هذا الجهاز؟')) return;
       localStorage.removeItem('munqidh_user_data');
       location.reload();
    };

    const defaultImages = {
      user: 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
      manager: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png',
      developer: 'https://cdn-icons-png.flaticon.com/512/6062/6062646.png',
      moderator: 'https://cdn-icons-png.flaticon.com/512/4042/4042253.png'
    };

    window.handleImageSelection = function(event) {
       const file = event.target.files[0];
       if (file) {
          document.getElementById('file-name-label').innerText = file.name;
          const reader = new FileReader();
          reader.onload = function(e) {
             const img = new Image();
             img.src = e.target.result;
             img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 200;
                const MAX_HEIGHT = 200;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                   if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                   if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
             }
          };
          reader.readAsDataURL(file);
       }
    };

    window.saveProfile = function() {
       let name = document.getElementById('reg-name').value.trim() || 'طالب مجتهد';
       let code = document.getElementById('reg-code').value.trim();
       
       let role = 'user';
       if(code === 'MGR-777') role = 'manager';
       else if(code === 'DEV-999') role = 'developer';
       else if(code.startsWith('MOD-1') && parseInt(code.split('-')[1]) <= 110) role = 'moderator';

       let pic = selectedImageBase64 || defaultImages[role];

       currentUser = {
         id: 'user_' + Date.now() + Math.random().toString(36).substr(2,9),
         name: name,
         pic: pic,
         role: role
       };

       localStorage.setItem('munqidh_user_data', JSON.stringify(currentUser));
       document.getElementById('login-modal').classList.add('hidden');
       setupPresence();
    }

    window.skipProfile = function() {
       currentUser = {
         id: 'user_' + Date.now() + Math.random().toString(36).substr(2,9),
         name: 'طالب (زائر)',
         pic: defaultImages.user,
         role: 'user'
       };
       localStorage.setItem('munqidh_user_data', JSON.stringify(currentUser));
       document.getElementById('login-modal').classList.add('hidden');
       setupPresence();
    }

    function setupPresence() {
      const connectedRef = ref(db, ".info/connected");
      const myPresenceRef = ref(db, 'munqidh_presence/' + currentUser.id);
      
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          set(myPresenceRef, { name: currentUser.name, role: currentUser.role });
          onDisconnect(myPresenceRef).remove();
        }
      });

      onValue(ref(db, 'munqidh_presence'), (snap) => {
         document.getElementById('online-count').innerText = snap.size || 0;
      });
    }

    const sndSend = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');
    const sndRecv = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3'); // صوت الاستقبال العام
    const sndReply = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    
    document.body.addEventListener('click', () => {
        if(sndSend.readyState === 0) { sndSend.load(); sndRecv.load(); sndReply.load(); }
    }, { once: true });

    let replyingTo = null;
    let unseenReplies = [];
    const initialLoadTime = Date.now();

    const chatContainer = document.getElementById('chat-messages');
    const scrollBtn = document.getElementById('scroll-bottom-btn');

    chatContainer.addEventListener('scroll', () => {
       const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 200;
       if(!isAtBottom) scrollBtn.classList.remove('hidden');
       else scrollBtn.classList.add('hidden');
    });

    window.scrollToBottom = function() {
       chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
    }

    onChildAdded(chatRef, (snapshot) => {
      const data = snapshot.val();
      data.id = snapshot.key;
      appendMessageToUI(data);

      const isNew = data.timestamp > initialLoadTime - 2000;
      const isReplyToMe = data.replyTo && data.replyTo.userId === currentUser?.id;

      if (isNew && data.userId !== currentUser?.id) {
         if (isReplyToMe) {
            if (soundSettings.reply) { sndReply.currentTime = 0; sndReply.play().catch(e => {}); }
            unseenReplies.push(data.id);
            updateBadge();
         } else {
            if (soundSettings.recv) { sndRecv.currentTime = 0; sndRecv.play().catch(e => {}); }
         }
      }
    });

    onChildChanged(chatRef, (snapshot) => {
       const data = snapshot.val();
       const el = document.getElementById(`msg-text-${snapshot.key}`);
       if(el) {
          el.innerText = data.text;
          const editedTag = document.getElementById(`msg-edited-${snapshot.key}`);
          if(!editedTag) {
             const tag = document.createElement('span');
             tag.id = `msg-edited-${snapshot.key}`;
             tag.className = 'text-[9px] text-slate-500 mr-2';
             tag.innerText = '(معدل)';
             el.parentNode.appendChild(tag);
          }
       }
    });

    onChildRemoved(chatRef, (snapshot) => {
       const wrapper = document.querySelector(`.message-wrapper[data-id="${snapshot.key}"]`);
       if(wrapper) {
          wrapper.classList.add('fade-out');
          setTimeout(() => wrapper.remove(), 300);
       }
    });

    window.sendMessage = function(event) {
      event.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const newMsg = {
        userId: currentUser.id,
        sender: currentUser.name,
        pic: currentUser.pic,
        role: currentUser.role,
        text: text,
        timestamp: Date.now()
      };

      if (replyingTo) newMsg.replyTo = replyingTo;

      push(chatRef, newMsg).then(() => {
         if (soundSettings.send) { sndSend.currentTime = 0; sndSend.play().catch(e => {}); }
      });

      input.value = '';
      cancelReply();
    };

    function appendMessageToUI(data) {
      const timeStr = new Date(data.timestamp || Date.now()).toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
      const isMe = data.userId === currentUser?.id;
      const hasModPower = ['manager', 'developer', 'moderator'].includes(currentUser?.role);
      
      const roleStyles = {
        manager: { bg: 'bg-gradient-to-br from-amber-500/20 to-yellow-600/20', border: 'border-amber-500/50', name: 'text-amber-400', badge: '👑 مدير' },
        developer: { bg: 'bg-gradient-to-br from-cyan-500/20 to-blue-600/20', border: 'border-cyan-500/50', name: 'text-cyan-400', badge: '💻 مطور' },
        moderator: { bg: 'bg-gradient-to-br from-purple-500/20 to-fuchsia-600/20', border: 'border-purple-500/50', name: 'text-purple-400', badge: '🛡️ مشرف' },
        user: { bg: isMe ? 'bg-emerald-500/10' : 'bg-slate-800/60', border: isMe ? 'border-emerald-500/30' : 'border-slate-700', name: isMe ? 'text-emerald-400' : 'text-slate-300', badge: '' }
      };

      const style = roleStyles[data.role] || roleStyles['user'];
      const editedHTML = data.edited ? `<span id="msg-edited-${data.id}" class="text-[9px] text-slate-500 mr-2">(معدل)</span>` : '';

      let actionButtons = '';
      if(isMe || hasModPower) {
        let editBtn = isMe ? `<button onclick="editMessage('${data.id}', \`${escapeHtml(data.text)}\`)" class="text-slate-500 hover:text-blue-400"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>` : '';
        let delBtn = `<button onclick="deleteMessage('${data.id}')" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`;
        actionButtons = `<div class="flex gap-2 items-center opacity-0 group-hover:opacity-100 transition">${editBtn}${delBtn}</div>`;
      }

      let replyHTML = '';
      if (data.replyTo) {
         replyHTML = `
           <div onclick="scrollToMessage('${data.replyTo.id}')" class="bg-slate-950/40 p-2 rounded-lg mb-2 border-r-2 ${isMe ? 'border-emerald-500' : 'border-slate-500'} cursor-pointer hover:bg-slate-950/60 transition">
             <span class="text-[10px] md:text-xs font-bold block mb-0.5 text-slate-400">${escapeHtml(data.replyTo.sender)}</span>
             <span class="text-xs text-slate-300 truncate block">${escapeHtml(data.replyTo.text)}</span>
           </div>
         `;
      }

      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper flex items-start gap-2.5 msg-animate w-full group ${isMe ? 'flex-row-reverse' : ''}`;
      wrapper.dataset.id = data.id;

      const bubbleHTML = `
        <img src="${data.pic}" onclick="showProfile('${data.pic}', '${escapeHtml(data.sender)}', '${style.badge || 'طالب'}')" class="w-9 h-9 rounded-full object-cover border border-slate-700 cursor-pointer shrink-0 mt-1 shadow-sm active:scale-90 transition" />
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[80%]">
          <div class="bubble-content ${style.bg} ${style.border} border rounded-2xl p-3 shadow-sm cursor-pointer select-none relative reply-swipe-anim transition-all ${isMe ? 'rounded-tl-none' : 'rounded-tr-none'} min-w-[150px]">
            ${replyHTML}
            <div class="flex items-center justify-between gap-3 mb-1.5">
              <span class="font-extrabold ${style.name} text-xs flex items-center gap-1">
                ${escapeHtml(data.sender)} 
                ${style.badge ? `<span class="text-[9px] bg-slate-950/50 px-1.5 py-0.5 rounded-full">${style.badge}</span>` : ''}
              </span>
            </div>
            <p id="msg-text-${data.id}" class="text-slate-100 text-sm leading-relaxed break-words whitespace-pre-wrap">${escapeHtml(data.text)}</p>
            <div class="flex items-center justify-between mt-2 gap-4">
               <span class="text-[9px] text-slate-500" dir="ltr">${timeStr}${editedHTML}</span>
               ${actionButtons}
            </div>
          </div>
        </div>
      `;

      wrapper.innerHTML = bubbleHTML;
      chatContainer.appendChild(wrapper);

      const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 150;
      if (isAtBottom || isMe) chatContainer.scrollTop = chatContainer.scrollHeight;

      setupTouchGestures(wrapper.querySelector('.bubble-content'), data);
      lucide.createIcons();
    }

    window.deleteMessage = function(id) {
       if(confirm('هل أنت متأكد من حذف هذه الرسالة؟')) {
          remove(ref(db, `munqidh_live_chat_v2/${id}`));
       }
    };

    window.editMessage = function(id, oldText) {
       const newText = prompt('تعديل الرسالة:', oldText);
       if(newText !== null && newText.trim() !== '' && newText !== oldText) {
          update(ref(db, `munqidh_live_chat_v2/${id}`), { text: newText.trim(), edited: true });
       }
    };

    function setupTouchGestures(element, data) {
      let startX = 0, startY = 0, pressTimer;
      element.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        element.style.transform = 'scale(0.98)';
        pressTimer = setTimeout(() => { triggerReply(data); if(navigator.vibrate) navigator.vibrate(50); }, 500); 
      }, {passive: true});

      element.addEventListener('touchmove', (e) => {
        let diffX = startX - e.touches[0].clientX;
        let diffY = Math.abs(startY - e.touches[0].clientY);
        if(diffX > 10 || diffY > 10) clearTimeout(pressTimer); 
        if (diffX > 50 && diffY < 30) { triggerReply(data); if(navigator.vibrate) navigator.vibrate(50); startX = e.touches[0].clientX; }
      }, {passive: true});

      element.addEventListener('touchend', () => { clearTimeout(pressTimer); element.style.transform = 'scale(1)'; });
      element.addEventListener('touchcancel', () => { clearTimeout(pressTimer); element.style.transform = 'scale(1)'; });
      element.addEventListener('dblclick', () => triggerReply(data));
    }

    function triggerReply(data) {
       replyingTo = { id: data.id, userId: data.userId, sender: data.sender, text: data.text };
       document.getElementById('reply-preview-sender').innerText = 'الرد على: ' + data.sender;
       document.getElementById('reply-preview-text').innerText = data.text;
       document.getElementById('reply-preview').classList.remove('hidden');
       document.getElementById('chat-input').focus();
    }

    window.cancelReply = function() {
       replyingTo = null; document.getElementById('reply-preview').classList.add('hidden');
    }

    window.scrollToMessage = function(id) {
       const el = document.querySelector(`.message-wrapper[data-id="${id}"]`);
       if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const bubble = el.querySelector('.bubble-content');
          bubble.classList.add('bg-white/20', 'ring-2', 'ring-white');
          setTimeout(() => bubble.classList.remove('bg-white/20', 'ring-2', 'ring-white'), 1500);
       }
    };

    function updateBadge() {
       const badge = document.getElementById('mention-badge');
       const countElem = document.getElementById('mention-count');
       if (unseenReplies.length > 0) { badge.classList.remove('hidden'); countElem.innerText = unseenReplies.length; }
       else badge.classList.add('hidden');
    }

    window.scrollToNextReply = function() {
       if (unseenReplies.length > 0) {
          const targetId = unseenReplies.shift();
          scrollToMessage(targetId);
          updateBadge();
       }
    };

    window.showProfile = function(pic, name, role) {
       document.getElementById('modal-img').src = pic;
       document.getElementById('modal-name').innerText = name;
       document.getElementById('modal-role').innerText = role;
       
       const modal = document.getElementById('profile-modal');
       modal.classList.remove('hidden');
       setTimeout(() => modal.classList.remove('opacity-0'), 10);
    };

    window.closeProfileModal = function() {
       const modal = document.getElementById('profile-modal');
       modal.classList.add('opacity-0');
       setTimeout(() => modal.classList.add('hidden'), 300);
    };

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function (s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
